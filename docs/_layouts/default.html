<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="icon" type="image/png" href="{{ '/assets/app-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    <script src="{{ '/assets/downloads.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="UniFi Desktop documentation home">
          <img class="wordmark-icon" src="{{ '/assets/app-icon.png' | relative_url }}" alt="" width="34" height="34">
          <span>UniFi Desktop</span>
        </a>
        <nav aria-label="Main navigation">
          <a href="{{ '/getting-started/' | relative_url }}"{% if page.url == '/getting-started/' %} aria-current="page"{% endif %}>Get started</a>
          <a href="{{ '/managing/' | relative_url }}"{% if page.url == '/managing/' %} aria-current="page"{% endif %}>Managing your network</a>
          <a href="{{ '/troubleshooting/' | relative_url }}"{% if page.url == '/troubleshooting/' %} aria-current="page"{% endif %}>Troubleshooting</a>
          <a class="nav-download" href="https://github.com/thorrsson/osx-unifi/releases/latest" data-download="mac">Download</a>
        </nav>
      </div>
    </header>
    <main id="main" class="content{% if page.wide %} wide{% endif %}">
      {{ content }}
      <p class="download-status" data-download-status role="status" hidden></p>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <span>UniFi Desktop is an independent, open-source Mac app. It is not affiliated with or endorsed by Ubiquiti.</span>
        <a href="https://github.com/thorrsson/osx-unifi">View the project on GitHub</a>
      </div>
    </footer>
  </body>
</html>
