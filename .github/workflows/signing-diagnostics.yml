name: Signing diagnostics (temporary)
on:
  push:
    branches: ['thorrsson-fix-release-signing-identity']
    paths: ['.github/workflows/signing-diagnostics.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-26
    environment: release
    steps:
      - name: Import exactly like release.yml, then probe
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENT: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set +e -uo pipefail
          umask 077
          keychain="$RUNNER_TEMP/unifi-build.keychain-db"
          certificate="$RUNNER_TEMP/unifi-certificate.p12"
          password="$(uuidgen)"
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"
          echo "== which openssl: $(command -v openssl) / $(openssl version)"
          echo "== p12 bytes: $(wc -c < "$certificate")"
          openssl pkcs12 -in "$certificate" -passin env:CERTIFICATE_PASSWORD -noout; echo "openssl verify exit $?"
          openssl pkcs12 -in "$certificate" -passin env:CERTIFICATE_PASSWORD -nokeys 2>/dev/null \
            | openssl x509 -noout -issuer -enddate -fingerprint -sha1
          echo "== identity secret length: ${#IDENT}"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "== import:"
          security import "$certificate" -f pkcs12 -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security; echo "import exit $?"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null; echo "partition exit $?"
          echo "== user search list:"; security list-keychains -d user
          echo "== default keychain:"; security default-keychain
          echo "== find-identity (temp kc, all policies):"; security find-identity "$keychain"
          echo "== find-identity -v -p codesigning (temp kc):"; security find-identity -v -p codesigning "$keychain"
          echo "== certs in temp kc:"; security find-certificate -a -Z "$keychain" | grep -E 'SHA-1|"labl"'
          echo "== Developer ID CAs in System keychain:"
          security find-certificate -a -c "Developer ID Certification Authority" -Z /Library/Keychains/System.keychain | grep -E 'SHA-1|"labl"'
          leaf="$RUNNER_TEMP/leaf.pem"
          openssl pkcs12 -in "$certificate" -passin env:CERTIFICATE_PASSWORD -nokeys 2>/dev/null | openssl x509 > "$leaf"
          sha1="$(openssl x509 -in "$leaf" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
          echo "== verify-cert codeSign (temp kc):"; security verify-cert -c "$leaf" -p codeSign -k "$keychain"; echo "exit $?"
          echo "== verify-cert codeSign (default search):"; security verify-cert -c "$leaf" -p codeSign; echo "exit $?"
          target="$RUNNER_TEMP/probe"
          try() { cp /usr/bin/true "$target"; echo "== codesign $*:"; codesign --force "$@" "$target" 2>&1; echo "exit $?"; }
          try --keychain "$keychain" --sign "$IDENT" --timestamp=none
          try --keychain "$keychain" --sign "$sha1" --timestamp=none
          try --keychain "$keychain" --sign "$IDENT" --options runtime --timestamp
          echo "== add temp kc to user search list"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security list-keychains -d user
          echo "== find-identity -v -p codesigning (search list):"; security find-identity -v -p codesigning
          try --keychain "$keychain" --sign "$IDENT" --timestamp=none
          try --sign "$IDENT" --timestamp=none
          try --sign "$sha1" --timestamp=none
          try --keychain "$keychain" --sign "$IDENT" --options runtime --timestamp
          rm -f "$certificate"
          security delete-keychain "$keychain"
