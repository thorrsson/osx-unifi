name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Runner images ship several Xcodes and the default is not always the newest.
      # -runFirstLaunch installs the bundled packages; without them actool's
      # AssetCatalogAgent cannot load and compiling the app icon dies mid-connection.
      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          sudo xcodebuild -runFirstLaunch
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
      - name: Show toolchain
        run: swift --version && xcodebuild -version
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '3.3'
      - name: Test
        run: bash Scripts/test.sh
      - name: Test universal packaging and Sparkle appcast with throwaway keys
        run: ruby Scripts/test-packaging.rb
      # The smoke test discards its throwaway-key output; this ad-hoc DMG has updates disabled.
      - name: Package local-only universal DMG
        env:
          UNIFI_UNIVERSAL: '1'
          UNIFI_SPARKLE_PUBLIC_ED_KEY: ''
        run: bash Scripts/build-app.sh 0.1.0 && bash Scripts/make-dmg.sh 0.1.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniFiDesktop-local-only
          path: dist/*.dmg
          if-no-files-found: error
